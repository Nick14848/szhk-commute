<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>深港通勤模拟器 · By 尼克菜Nick</title>
    <meta
      name="description"
      content="香港赚钱深圳花。从福田口岸跑上东铁线，躲人、搬大水、和阿婆抢座位。By 尼克菜Nick"
    />
    <meta property="og:title" content="深港通勤模拟器" />
    <meta property="og:description" content="香港赚钱深圳花。从福田口岸跑上东铁线。By 尼克菜Nick" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://szhk-commute.vercel.app/" />
    <meta property="og:image" content="https://szhk-commute.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="深港通勤模拟器" />
    <meta name="twitter:description" content="香港赚钱深圳花。从福田口岸跑上东铁线。By 尼克菜Nick" />
    <meta name="twitter:image" content="https://szhk-commute.vercel.app/og.png" />
    <meta name="theme-color" content="#F7F7F7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="深港通勤" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <header id="hud" hidden>
        <div class="hud-row">
          <span id="day-label">第 1 天</span>
          <span class="hud-right">
            <span id="waters">收集大水 0</span>
            <span id="score-wrap"><span class="score-k">当前分数</span><b id="score">00000</b></span>
          </span>
        </div>
        <div class="hud-row hud-place">
          <button id="btn-pause" type="button">暂停</button>
          <span class="place-cluster">
            <span id="place-name">福田口岸</span>
            <span id="line-name">东铁线 · 往金钟</span>
          </span>
        </div>
        <div id="border-row"></div>
        <div id="rail" tabindex="0"></div>
        <div id="notice">
          <p id="status"></p>
          <p id="banner"></p>
        </div>
      </header>
      <canvas id="view" tabindex="-1" aria-label="深港通勤模拟器游戏画面"></canvas>
      <div id="overlay"></div>
      <p id="layout-note" hidden>屏幕太矮，竖过来更好玩。</p>
      <div id="pad" hidden>
        <button id="btn-duck" type="button">蹲</button>
        <button id="btn-jump" type="button">跳</button>
      </div>
      <div id="paused" hidden>
        <p id="pause-title">通勤暂停</p>
        <div id="full-map"></div>
        <button id="btn-resume" type="button">继续通勤</button>
        <button id="btn-restart" type="button">重新开始</button>
      </div>
      <div id="safe-probe" aria-hidden="true"></div>
      <footer id="credit">
        <span>尼克菜Nick</span>
        <span aria-hidden="true">·</span>
        <a href="https://xhslink.com/m/8uQvbHfgDI6" target="_blank" rel="noopener noreferrer">小红书</a>
        <span aria-hidden="true">·</span>
        <a href="https://www.douyin.com/search/%E5%B0%BC%E5%85%8B%E8%8F%9CNick" target="_blank" rel="noopener noreferrer">抖音</a>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
